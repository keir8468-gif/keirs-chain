name: Build macOS (AU + VST3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target KeirsChain_AU KeirsChain_VST3 -- -quiet

      - name: Collect + ad-hoc sign
        run: |
          mkdir -p dist
          cp -R "build/KeirsChain_artefacts/Release/AU/Keir's Chain.component" dist/
          cp -R "build/KeirsChain_artefacts/Release/VST3/Keir's Chain.vst3" dist/
          codesign --force --deep -s - "dist/Keir's Chain.component"
          codesign --force --deep -s - "dist/Keir's Chain.vst3"
          lipo -info "dist/Keir's Chain.vst3/Contents/MacOS/Keir's Chain"

      - name: Validate Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/Keir's Chain.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aufx Kcha Keir

      - name: Zip
        run: |
          cp INSTALL.md dist/
          cd dist && ditto -c -k --keepParent . "../KeirsChain-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: KeirsChain-mac
          path: KeirsChain-mac.zip

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KeirsChain-mac.zip
